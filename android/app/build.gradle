apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.google.devtools.ksp'

// CI (see .github/workflows/release.yml) overrides these via -PreleaseVersionCode/-PreleaseVersionName
// when building from a published release tag; local/default builds keep the checked-in values.
def releaseVersionCode = (project.findProperty('releaseVersionCode') as String)?.toInteger() ?: 1
def releaseVersionName = project.findProperty('releaseVersionName') as String ?: "0.1.0"

// Release signing is CI-only, sourced from GitHub Actions secrets (see .github/workflows/release.yml)
// and never committed — local `assembleRelease` builds stay unsigned when these aren't set.
def releaseKeystorePath = System.getenv('RELEASE_KEYSTORE_PATH')
def hasReleaseSigning = releaseKeystorePath != null && !releaseKeystorePath.isBlank()

android {
    namespace = "com.phuzle.labs.repacks"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.phuzle.labs.repacks"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseVersionCode
        versionName releaseVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
    // Per-ABI release APKs for direct-download (GitHub Release) distribution, alongside a
    // universal one, scoped to release builds only so local `assembleDebug` stays a single APK.
    def isBuildingReleaseApk = gradle.startParameter.taskNames.any { it.toLowerCase().contains('assemblerelease') }
    splits {
        abi {
            enable isBuildingReleaseApk
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            universalApk true
        }
    }
    buildFeatures {
        buildConfig true
    }
    // Matches capacitor.build.gradle's own compileOptions (regenerated by `cap sync`/`cap update`
    // on every run, always Java 21 in current Capacitor templates) — declaring anything else here
    // just gets silently overridden by that file, which is applied after this block, and having
    // Java/Kotlin disagree on JVM target is a hard error either way.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Transplanted native business logic (data/, work/, notification/, updater/, core/) —
    // same dependency set + versions as the old (now-retired) app/ module.
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "androidx.room:room-runtime:2.7.1"
    implementation "androidx.room:room-ktx:2.7.1"
    ksp "androidx.room:room-compiler:2.7.1"
    implementation "androidx.datastore:datastore-preferences:1.1.1"
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jsoup:jsoup:1.18.1"
    implementation "io.coil-kt.coil3:coil:3.0.4"
    implementation "io.coil-kt.coil3:coil-network-okhttp:3.0.4"
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
