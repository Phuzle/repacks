name: Release

# Fires on a version tag push (PRD §9). Publishes signed release APKs — universal plus one per
# ABI — as assets on a GitHub Release. Distribution is GitHub-only (no Play Store): the in-app
# self-updater (updater/UpdateChecker.kt) polls this repo's /releases/latest.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_SECRET: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build web (static export)
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Sync web build into the Android project
        run: npx cap sync android

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # versionName mirrors the tag (minus its leading "v"); versionCode must be a strictly
      # increasing integer, which this workflow's own run number satisfies for free.
      - name: Derive app version from tag
        id: version
        run: |
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Signing is optional: if the repo hasn't had these secrets configured yet, the build falls
      # back to an unsigned release APK (see android/app/build.gradle's hasReleaseSigning) rather
      # than failing outright, so this workflow works before anyone's set up a signing key.
      - name: Decode release keystore
        if: env.HAS_SIGNING_SECRET == 'true'
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "${{ runner.temp }}/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=${{ runner.temp }}/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PreleaseVersionCode=${{ steps.version.outputs.code }} \
            -PreleaseVersionName=${{ steps.version.outputs.name }}

      - name: Collect release assets
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p release-assets
          APK_DIR="android/app/build/outputs/apk/release"
          cp "$APK_DIR/app-universal-release.apk" "release-assets/repacks-v${VERSION}.apk"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            f="$APK_DIR/app-${abi}-release.apk"
            [ -f "$f" ] && cp "$f" "release-assets/repacks-${abi}-v${VERSION}.apk"
          done

      - name: Attach APKs to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.apk
          generate_release_notes: true
